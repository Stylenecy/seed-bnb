[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc = "${BSC_RPC_URL}"

[etherscan]
# BscScan via the Etherscan V2 multichain API (one key for every chain).
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 97 }
bsc = { key = "${ETHERSCAN_API_KEY}", chain = 56 }
