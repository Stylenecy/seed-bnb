[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc_version   = "0.8.24"
optimizer      = true
optimizer_runs = 200


remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[profile.ci]
fuzz = { runs = 1000 }


[rpc_endpoints]
localhost   = "http://127.0.0.1:8545"
bsc_testnet = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
testnet     = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"
bsc         = "https://bsc-dataseed.bnbchain.org"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97, url = "https://api-testnet.bscscan.com/api" }
bsc         = { key = "${BSCSCAN_API_KEY}", chain = 56, url = "https://api.bscscan.com/api" }

[fmt]
line_length = 100
tab_width   = 4
