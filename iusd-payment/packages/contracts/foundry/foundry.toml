[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true   # the Move views return wide tuples; via-IR avoids stack-too-deep

# BNB Smart Chain
[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc         = "${BSC_RPC_URL}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
bsc         = { key = "${BSCSCAN_API_KEY}", chain = 56 }
