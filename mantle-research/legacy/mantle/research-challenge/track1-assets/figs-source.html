<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mantle RWA figures v3</title>
<style>
  :root{
    --bg:#0A1312; --surface:#0F1B1A; --panel:#132320; --panel2:#162926;
    --teal:#65B3AE; --teal-deep:#2E6B66; --tint:#CCE9E7;
    --ink:#F4FAF9; --ink2:#AFC4C1; --ink3:#6E8A86;
    --line:rgba(101,179,174,.16); --line2:rgba(101,179,174,.30);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;background:var(--bg);overflow:hidden;
    font-family:"GT Walsheim","Avenir Next","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  .canvas{position:absolute;inset:26px;background:
      radial-gradient(1200px 700px at 12% -10%, rgba(101,179,174,.10), transparent 55%),
      radial-gradient(900px 600px at 105% 115%, rgba(144,133,233,.05), transparent 55%),
      var(--surface);
    border:1px solid var(--line);border-radius:30px;padding:52px 58px;overflow:hidden}
  body.banner .canvas{inset:0;border-radius:0;border:none;padding:56px 84px}
  .dots{position:absolute;inset:0;border-radius:30px;pointer-events:none;opacity:.5;
    background-image:radial-gradient(rgba(204,233,231,.05) 1.1px, transparent 1.1px);
    background-size:26px 26px}
  .hdr{position:relative;display:flex;justify-content:space-between;align-items:center}
  .kick{display:flex;align-items:center;gap:12px;font-size:13.5px;font-weight:600;
    letter-spacing:.22em;color:var(--teal);text-transform:uppercase}
  .kick .sq{width:11px;height:11px;background:var(--teal);border-radius:3px;
    box-shadow:0 0 14px rgba(101,179,174,.8)}
  .brand{font-size:13px;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;font-weight:600}
  h1{position:relative;font-size:40px;font-weight:700;letter-spacing:-.015em;line-height:1.08;margin-top:20px}
  h1 .em{color:var(--teal)}
  .sub{position:relative;font-size:17px;line-height:1.5;color:var(--ink2);margin-top:12px;max-width:1080px}
  .pillrow{position:absolute;left:58px;right:58px;bottom:40px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .pill{font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;background:rgba(19,35,32,.6);letter-spacing:.02em}
  .pill b{color:var(--tint);font-weight:600}
  svg text{font-family:inherit}
  .ax{font-size:13px;fill:var(--ink3)}
  .axb{font-size:13.5px;fill:var(--ink2);font-weight:600}
  .dl{font-weight:700;fill:var(--ink)}
  .chip{font-size:13px;font-weight:600;fill:var(--tint)}
  .statcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:20px;padding:22px 24px}
  .statcard .k{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600}
  .statcard .v{font-size:46px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
  .statcard .d{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.4}
</style>
</head>
<body>
<div class="canvas" id="canvas"><div class="dots"></div><div id="root" style="position:relative;height:100%"></div></div>
<script>
/* Mantle-anchored semantic palette, validated with the dataviz skill's script:
   TEAL   #65B3AE  distributed / gateway / positive (brand anchor)
   BLUE   #3987E5  secondary category (existing users, evidence 1, TradFi pool)
   AMBER  #C98500  the window event / concentrated / warnings
   CORAL  #E66767  issuer-locked / not adopted / exited / gaps
   VIOLET #9085E9  tertiary (crypto users, KPI move)
   CVD worst adjacent pair 35.9 (target >= 12), contrast all >= 3:1 on this surface.
   Brand teal sits slightly above the reference lightness band; every mark carries
   a direct label, which is the skill's sanctioned relief. */
const TEAL="#65B3AE", TEALD="#2E6B66", TINT="#CCE9E7",
      BLUE="#3987E5", BLUE_T="#7FB3EE",
      AMBER="#C98500", AMBER_T="#E2A93F",
      CORAL="#E66767", CORAL_T="#ED8C8C",
      VIOLET="#9085E9",
      INK="#F4FAF9", INK2="#AFC4C1", INK3="#6E8A86",
      SURF="#0F1B1A", LINE="rgba(101,179,174,.16)", GRID="rgba(101,179,174,.10)";

const trend=[["2025-12-01",3,3],["2026-01-19",4,1],["2026-03-02",6,2],["2026-03-23",31,25],
 ["2026-03-30",34,3],["2026-04-06",45,11],["2026-04-13",397,353],["2026-04-20",653,260],
 ["2026-04-27",802,150],["2026-05-04",850,53],["2026-05-11",871,23],["2026-05-18",875,4],
 ["2026-05-25",876,1],["2026-06-01",882,6],["2026-06-08",905,24],["2026-06-15",916,13],
 ["2026-06-22",925,11],["2026-06-29",926,3]];

function hdr(kick, right){ return `<div class="hdr"><div class="kick"><div class="sq"></div>${kick}</div><div class="brand">${right||"Mantle RWA Research"}</div></div>`; }
function pills(items){ return `<div class="pillrow">${items.map(t=>`<div class="pill">${t}</div>`).join("")}</div>`; }

const F={};

/* ============ COVER (bento) ============ */
F.cover=function(){
  const spark=trend.map(d=>d[1]);
  const smax=1000, sw=178, sh=54;
  const sp=spark.map((v,i)=>`${(i/(spark.length-1)*sw).toFixed(1)},${(sh-v/smax*sh).toFixed(1)}`).join(" ");
  const weekly=trend.map(d=>d[2]);
  let wbars="";
  weekly.forEach((v,i)=>{ const h=Math.max(v/380*sh,1.5);
    const inWin=i>=6&&i<=9;
    wbars+=`<rect x="${(i*(sw/weekly.length)).toFixed(1)}" y="${(sh-h).toFixed(1)}" width="6.5" height="${h.toFixed(1)}" rx="2.5" fill="${inWin?AMBER_T:'rgba(110,138,134,.5)'}"/>`; });
  const rr=34, rc=2*Math.PI*rr, roff=rc*(1-0.983);
  const tile=(span,inner,accent)=>`<div style="grid-column:span ${span};background:linear-gradient(180deg,${accent?accent+'26':'#162926'},${accent?accent+'0d':'#132320'});
      border:1px solid ${accent?accent+'80':LINE};border-radius:20px;padding:20px 24px;position:relative;overflow:hidden;
      ${accent?`box-shadow:0 0 36px ${accent}1f;`:''}">${inner}</div>`;
  const K=(s)=>`<div style="font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;color:${INK3};font-weight:600">${s}</div>`;
  const V=(s,c)=>`<div style="font-size:44px;font-weight:800;letter-spacing:-.025em;margin-top:6px;color:${c||INK};font-variant-numeric:tabular-nums">${s}</div>`;
  const D=(s)=>`<div style="font-size:13px;color:${INK2};margin-top:5px;line-height:1.45">${s}</div>`;
  return `
  ${hdr("926 Wallets, One Door","Mantle RWA Research")}
  <h1 style="font-size:34px;margin-top:16px">The research <span class="em">at a glance</span></h1>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:20px">
    ${tile(1,`${K("Issued vs distributed")}${V("368 <span style='color:"+INK3+";font-size:30px'>to</span> <span style='color:"+TEAL+"'>1</span>",null)}
      ${D("tokenized US equities on Mantle; one passes the distribution thresholds")}
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:5px">
        <div style="height:7px;width:100%;border-radius:4px;background:rgba(110,138,134,.3)"></div>
        <div style="height:7px;width:4.1%;border-radius:4px;background:${AMBER}"></div>
        <div style="height:7px;width:1.2%;border-radius:4px;background:${TEAL};box-shadow:0 0 10px rgba(101,179,174,.9)"></div>
      </div>`)}
    ${tile(2,`<div style="display:flex;justify-content:space-between;gap:18px">
      <div>${K("The window")}<div style="font-size:44px;font-weight:800;letter-spacing:-.025em;margin-top:6px;color:${AMBER_T}">88%</div>
      ${D("of all holders ever arrived in one four-week window, April 13 to May 10, 2026, after Bybit opened xStocks withdrawals to Mantle")}</div>
      <svg width="${sw}" height="${sh+22}" viewBox="0 0 ${sw} ${sh+22}" style="margin-top:14px;flex:none">${wbars}
        <text x="${sw/2}" y="${sh+18}" text-anchor="middle" style="font-size:10.5px;fill:${INK3};letter-spacing:.08em">FIRST-TIME HOLDERS PER WEEK</text></svg>
      </div>`,AMBER)}
    ${tile(1,`${K("Retention")}
      <div style="display:flex;gap:16px;align-items:center;margin-top:8px">
        <svg width="84" height="84" viewBox="0 0 84 84" style="flex:none">
          <circle cx="42" cy="42" r="${rr}" fill="none" stroke="rgba(230,103,103,.35)" stroke-width="9"/>
          <circle cx="42" cy="42" r="${rr}" fill="none" stroke="${TEAL}" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${rc.toFixed(1)}" stroke-dashoffset="${roff.toFixed(1)}" transform="rotate(-90 42 42)"/>
        </svg>
        <div><div style="font-size:30px;font-weight:800;color:${TEAL}">98.3%</div>
        <div style="font-size:12.5px;color:${INK2};line-height:1.4;margin-top:2px">of the cohort still holds, 8 weeks later</div></div>
      </div>`)}
    ${tile(1,`${K("Holders today")}${V("926")}
      <svg width="${sw}" height="${sh}" viewBox="0 0 ${sw} ${sh}" style="margin-top:10px">
        <polyline points="${sp}" fill="none" stroke="${TEAL}" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="${sw}" cy="${(sh-926/smax*sh).toFixed(1)}" r="3.5" fill="${TINT}"/></svg>
      ${D("wallets holding any xStock, from 6 in mid-March")}`)}
    ${tile(1,`${K("New users")}${V("421",BLUE_T)}
      ${D("wallets arrived on Mantle <b style='color:${INK}'>with their first xStock</b>: 45.6% of all holders. The other half are 459-day veterans")}`)}
    ${tile(1,`${K("The door")}
      <div style="display:flex;gap:16px;align-items:center;margin-top:10px">
        <svg width="56" height="86" viewBox="0 0 56 86" style="flex:none">
          <rect x="6" y="4" width="44" height="78" rx="10" fill="none" stroke="rgba(204,233,231,.4)" stroke-width="1.5"/>
          <rect x="24" y="10" width="7" height="66" rx="3.5" fill="${TEAL}" style="filter:drop-shadow(0 0 8px rgba(101,179,174,.9))"/>
        </svg>
        <div><div style="font-size:19px;font-weight:800;line-height:1.2">Apr 10, 2026</div>
        <div style="font-size:12.5px;color:${INK2};line-height:1.45;margin-top:4px">Bybit enables xStocks deposits and withdrawals on Mantle</div></div>
      </div>`)}
    ${tile(1,`${K("Measurement gap")}<div style="font-size:44px;font-weight:800;letter-spacing:-.025em;margin-top:6px;color:${CORAL_T}">NULL</div>
      ${D("what <b style='color:${INK}'>amount_usd</b> returns for every xStock DEX trade; Fluxion is not indexed at all")}`)}
  </div>
  ${pills([
    "By <b>Yeheskiel Yunus Tame</b> (@YeheskielTame), UKDW Blockchain Club",
    "13 public queries: <b>dune.com/yeheskiel/mantle-rwa-distribution-tracker</b>",
    "Snapshot <b>2026-07-02</b>"])}`;
};

/* ============ TREND (Figure 1) ============ */
F.trend=function(){
  const PL=64,PR=830,PT=90,PB=300;
  const t0=Date.parse("2025-11-24"), t1=Date.parse("2026-07-08");
  const X=iso=>PL+(Date.parse(iso)-t0)/(t1-t0)*(PR-PL);
  const Y=v=>PT+(1-v/1000)*(PB-PT);
  const annX=X("2026-04-10"), wA=X("2026-04-13"), wB=X("2026-05-11");
  const pts=trend.map(d=>[X(d[0]),Y(d[1])]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${Y(0)} L ${pts[0][0].toFixed(1)} ${Y(0)} Z`;
  let grid="", yl="";
  for(const v of [250,500,750,1000]){
    grid+=`<line x1="${PL}" x2="${PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="${GRID}" stroke-width="1"/>`;
    yl+=`<text x="${PL-12}" y="${Y(v)+4}" text-anchor="end" class="ax">${v}</text>`;
  }
  const BT=352,BB=462;
  const YB=v=>BT+(1-v/380)*(BB-BT);
  let bars="";
  for(const d of trend){
    const inWin=Date.parse(d[0])>=Date.parse("2026-04-13")&&Date.parse(d[0])<Date.parse("2026-05-11");
    bars+=`<rect x="${(X(d[0])-6).toFixed(1)}" y="${YB(d[2]).toFixed(1)}" width="12" height="${Math.max(BB-YB(d[2]),2).toFixed(1)}" rx="4"
      fill="${inWin?AMBER_T:'rgba(110,138,134,.45)'}"/>`;
  }
  let months="";
  for(const [iso,l] of [["2025-12-01","DEC"],["2026-01-01","JAN"],["2026-02-01","FEB"],["2026-03-01","MAR"],["2026-04-01","APR"],["2026-05-01","MAY"],["2026-06-01","JUN"],["2026-07-01","JUL"]])
    months+=`<text x="${X(iso)}" y="${BB+30}" class="ax" text-anchor="middle" style="letter-spacing:.08em">${l}</text>`;
  return `
  ${hdr("Figure 1, holder growth")}
  <h1>One four-week window created <span style="color:${AMBER_T}">88%</span> of all holders</h1>
  <div class="sub">Distinct wallets holding any of the 368 xStocks on Mantle, December 2025 to July 2026. Exact end-of-week balances, issuer excluded. The teal line is total holders; amber bars are the window's weekly arrivals.</div>
  <div style="display:flex;gap:26px;margin-top:6px">
    <svg width="880" height="510" viewBox="0 0 880 510">
      <defs>
        <linearGradient id="af" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${TEAL}" stop-opacity=".38"/><stop offset="1" stop-color="${TEAL}" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="wband" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${AMBER}" stop-opacity=".16"/><stop offset="1" stop-color="${AMBER}" stop-opacity=".03"/>
        </linearGradient>
        <filter id="lineglow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <rect x="${wA}" y="${PT-26}" width="${wB-wA}" height="${BB-PT+26}" fill="url(#wband)" rx="10"/>
      <line x1="${wA}" x2="${wA}" y1="${PT-26}" y2="${BB}" stroke="${AMBER_T}" stroke-width="1" opacity=".5"/>
      <line x1="${wB}" x2="${wB}" y1="${PT-26}" y2="${BB}" stroke="${AMBER_T}" stroke-width="1" opacity=".5"/>
      <text x="${(wA+wB)/2}" y="${PT-38}" text-anchor="middle" style="font-size:13px;font-weight:600;fill:${AMBER_T};letter-spacing:.1em">THE BYBIT WINDOW</text>
      <text x="${(wA+wB)/2}" y="${PT-8}" text-anchor="middle" style="font-size:12px;fill:${INK3}">APR 13 TO MAY 10</text>
      ${grid}${yl}
      <line x1="${annX}" x2="${annX}" y1="${PT+6}" y2="${BB}" stroke="${TINT}" stroke-width="1.4" stroke-dasharray="2 6" opacity=".8"/>
      <path d="M ${annX} ${PT+2} l -5 -9 l 10 0 Z" fill="${TINT}"/>
      <path d="${area}" fill="url(#af)"/>
      <path d="${line}" fill="none" stroke="${TEAL}" stroke-width="3" stroke-linejoin="round" filter="url(#lineglow)"/>
      <circle cx="${pts[17][0]}" cy="${pts[17][1]}" r="5.5" fill="${TINT}" stroke="${SURF}" stroke-width="2.5"/>
      <text x="${pts[17][0]}" y="${pts[17][1]-16}" text-anchor="end" class="dl" style="font-size:22px">926</text>
      <text x="${X("2026-01-26")}" y="${Y(0)-58}" text-anchor="middle" style="font-size:13.5px;fill:${INK2}">first 3.5 months:</text>
      <text x="${X("2026-01-26")}" y="${Y(0)-38}" text-anchor="middle" style="font-size:13.5px;fill:${INK2}">only 6 holders</text>
      <text x="${PL}" y="${BT-12}" class="axb">First-time holders per week</text>
      <line x1="${PL}" x2="${PR}" y1="${BB}" y2="${BB}" stroke="${GRID}" stroke-width="1"/>
      ${bars}
      <text x="${X("2026-04-13")}" y="${YB(353)-10}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:${AMBER_T}">353</text>
      ${months}
    </svg>
    <div style="display:flex;flex-direction:column;gap:16px;width:330px;margin-top:26px">
      <div class="statcard"><div class="k">Holders today</div><div class="v">926</div><div class="d">wallets holding any xStock</div></div>
      <div class="statcard" style="border-color:rgba(201,133,0,.5);background:linear-gradient(180deg,rgba(201,133,0,.13),rgba(201,133,0,.04))">
        <div class="k" style="color:${AMBER_T}">The window</div><div class="v" style="color:${AMBER_T}">+816</div><div class="d">new holders in 4 weeks, 88% of all time</div></div>
      <div class="statcard"><div class="k">Since May 18</div><div class="v">1 to 11</div><div class="d">new holders per week</div></div>
    </div>
  </div>
  ${pills(["Source: Dune query <b>7865851</b>","Raw <b>mantle.logs</b>, decimal(38,0)","Announcement: <b>Bybit, Apr 10, 2026</b>"])}`;
};

/* ============ FUNNEL (Figure 2) ============ */
F.funnel=function(){
  const rows=[
    {n:"368",label:"Tokenized US equities issued on Mantle",d:"Backed's xStocks family, live since December 2025",w:1,col:"#5A7A76",num:INK},
    {n:"15",label:"Have at least ten holders",d:"4.1% of everything issued",w:15/368,col:AMBER,num:AMBER_T},
    {n:"1",label:"Genuinely distributed: NVDAx",d:"612 holders, top wallet 74.55%, crossed both thresholds in the Bybit window",w:1/368,col:TEAL,num:TEAL,hot:true},
  ];
  const cards=rows.map((r,i)=>`
    <div style="display:flex;align-items:center;gap:34px;background:linear-gradient(180deg,${r.hot?'rgba(101,179,174,.14)':'#162926'},${r.hot?'rgba(101,179,174,.05)':'#132320'});
        border:1px solid ${r.hot?'rgba(101,179,174,.5)':LINE};border-radius:20px;padding:16px 32px;
        ${r.hot?'box-shadow:0 0 40px rgba(101,179,174,.15);':''}">
      <div style="font-size:58px;font-weight:800;letter-spacing:-.03em;width:150px;text-align:right;
        color:${r.num};font-variant-numeric:tabular-nums">${r.n}</div>
      <div style="width:1px;align-self:stretch;background:${LINE}"></div>
      <div style="flex:1">
        <div style="font-size:19px;font-weight:700">${r.label}</div>
        <div style="font-size:15px;color:${INK2};margin-top:5px">${r.d}</div>
        <div style="margin-top:11px;height:9px;border-radius:6px;background:rgba(110,138,134,.18);position:relative">
          <div style="position:absolute;inset:0;width:${Math.max(r.w*100,0.8)}%;border-radius:6px;
            background:${r.col};${r.hot?'box-shadow:0 0 18px rgba(101,179,174,.7);':''}"></div>
        </div>
      </div>
    </div>
    ${i<2?`<div style="text-align:center;color:${INK3};font-size:18px;line-height:.55;margin:5px 0">&#8595;</div>`:""}`).join("");
  return `
  ${hdr("Figure 2, the adoption funnel")}
  <h1><span class="em">368</span> issued, <span class="em">1</span> distributed</h1>
  <div class="sub">Thresholds set in advance: a token counts as distributed when it has more than 500 holders and its top wallet holds less than 75% of supply. Bars are proportional to token count.</div>
  <div style="margin-top:24px;display:flex;flex-direction:column">${cards}</div>
  ${pills(["Source: Dune <b>7863671</b> (league)","Dune <b>7863679</b> (summary)","Exact decimal(38,0) balances","Snapshot <b>2026-07-02</b>"])}`;
};

/* ============ LEAGUE (Figure 3) ============ */
F.league=function(){
  const V={D:{c:TEAL,t:"DISTRIBUTED",tc:TEAL},C:{c:AMBER,t:"CONCENTRATED",tc:AMBER_T},I:{c:CORAL,t:"ISSUED, NOT ADOPTED",tc:CORAL_T}};
  const rows=[
    ["NVDAx",612,74.6,"D"],["TSLAx",328,82.0,"C"],["CRCLx",318,90.8,"I"],["GOOGLx",89,86.8,"C"],
    ["COINx",35,85.0,"C"],["SPCXx",26,99.2,"I"],["AAPLx",25,90.9,"I"],["HOODx",21,96.2,"I"],
    ["METAx",19,95.2,"I"],["wNVDAx",14,90.7,"I"],
  ];
  const PL=150,PW=530,RH=36,GAP=8;
  let bars="";
  rows.forEach((r,i)=>{
    const y=30+i*(RH+GAP);
    const w=Math.max(r[1]/612*PW,4);
    const v=V[r[3]], hot=r[3]==="D";
    bars+=`
      <text x="${PL-16}" y="${y+RH/2+5}" text-anchor="end" style="font-size:16px;font-weight:700;fill:${hot?TEAL:INK}">${r[0]}</text>
      <rect x="${PL}" y="${y}" width="${w.toFixed(1)}" height="${RH}" rx="8" fill="${v.c}" opacity="${hot?1:.6}" ${hot?'filter="url(#lgl)"':''}/>
      <text x="${PL+w+12}" y="${y+RH/2+5}" style="font-size:15px;font-weight:700;fill:${INK}">${r[1]}</text>
      <text x="${PL+PW+185}" y="${y+RH/2+5}" text-anchor="end" style="font-size:14px;fill:${INK2};font-variant-numeric:tabular-nums">${r[2].toFixed(1)}%</text>
      <rect x="${PL+PW+215}" y="${y+5}" width="210" height="${RH-10}" rx="12" fill="${v.c}1f" stroke="${v.c}66"/>
      <text x="${PL+PW+320}" y="${y+RH/2+4.5}" text-anchor="middle" style="font-size:11px;letter-spacing:.08em;font-weight:600;fill:${v.tc}">${v.t}</text>`;
  });
  const H=30+rows.length*(RH+GAP)+8;
  return `
  ${hdr("Figure 3, the league")}
