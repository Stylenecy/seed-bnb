[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC}"
bsc = "${BSC_RPC}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }
